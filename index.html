<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>竞品动态监测</title><style>body{font:16px Arial;background:#f4f6f3;margin:0;color:#202923}header{background:#10251f;color:white;padding:30px}main{max-width:1000px;margin:auto;padding:24px}.row{display:grid;grid-template-columns:1fr 250px;gap:14px}.card,aside{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:10px 0}.tag{color:#08704e}a{color:#08704e}button,input,select{padding:10px;border:1px solid #ddd;border-radius:9px;margin:4px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style><header><h1>内容到购买 · 竞品动态</h1>SHEIN · Temu · TikTok Shop · AliExpress</header><main><p>英国市场监测快照　更新至 2026 年 11 月 23 日</p><button onclick="f('全部')">全部</button><button onclick="f('SHEIN')">SHEIN</button><button onclick="f('Temu')">Temu</button><button onclick="f('TikTok Shop')">TikTok Shop</button><button onclick="f('AliExpress')">AliExpress</button><input id='q' placeholder='搜索动态' oninput='render()'><select id='k' onchange='render()'><option>全部主题</option><option>活动与促销</option><option>内容与达人</option><option>履约与政策</option><option>用户反馈</option></select><div class='row'><section id='feed'></section><aside><h3>观察摘要</h3><p>推荐流和直播帮助商品发现，买家评价和规格信息支持临门决策。</p><p>TikTok Shop英国符合条件节日订单可退货至2027年1月31日。</p><p>公开资料缺少统一转化率口径，暂不能进行平台转化排名。</p><hr><p>页面提供平台筛选、主题筛选与关键词搜索。资料为截至11月23日核验的快照，未连接自动刷新。</p></aside></div></main><script>let B='全部',D=[['11.20','TikTok Shop','履约与政策','英国节日订单退货窗口延长','符合条件的订单可退货至2027年1月31日。','https://seller-uk.tiktok.com/university/essay?knowledge_id=272049231120150&lang=en-GB'],['11.13','TikTok Shop','内容与达人','英国直播购物报告','每日逾6000场直播购物，直播销售同比增长55%。','https://newsroom.tiktok.com/tiktokshoplivereport?lang=en-GB'],['11.13','TikTok Shop','活动与促销','英国黑五直播促销开启','活动从11月13日至30日，直播演示和实时答疑是重要触点。','https://homeofdirectcommerce.com/news/tiktok-shop-live-shopping-report/'],['11.19','AliExpress','活动与促销','双十一转入黑五网一','英国促销季预计持续至12月3日，优惠券与本地仓承接需求。','https://beyondthebasket.co.uk/aliexpress-runs-five-week-uk-sale-from-11-11-through-to-cyber-monday/'],['11.12','SHEIN','活动与促销','英国站启动大促抽奖','官方规则显示活动于11月12日开始。','https://m.shein.co.uk/sheinbigsale-blackfriday-sweepstakes-official-rules-2026-a-4069.html'],['11月','Temu','用户反馈','返现条件不够直观','英国App Store评论提及返现或购物金后续条件。','https://apps.apple.com/gb/app/temu-shop-like-a-billionaire/id1641486558?platform=iphone&see-all=reviews']];function f(x){B=x;render()}function render(){let q=document.querySelector('#q').value.toLowerCase(),k=document.querySelector('#k').value;document.querySelector('#feed').innerHTML=D.filter(x=>(B==='全部'||x[1]===B)&&(k==='全部主题'||x[2]===k)&&x.slice(1,5).join(' ').toLowerCase().includes(q)).map(x=>`<article class='card'><small>${x[0]}.2026</small><div class='tag'>${x[1]} · ${x[2]}</div><h3>${x[3]}</h3><p>${x[4]}</p><a href='${x[5]}' target='_blank'>查看来源 ↗</a></article>`).join('')||'无匹配动态'}render()</script></html>
